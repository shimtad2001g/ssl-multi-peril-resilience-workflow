<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Multi-Peril Resilience Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #1e1e2f; color: #ffffff; }
        .header { background-color: #27293d; padding: 20px; text-align: center; border-bottom: 2px solid #00f2c3; }
        .container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; justify-content: center; }
        .card { background-color: #27293d; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); flex: 1; min-width: 350px; }
        .card h2 { color: #00f2c3; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .map-container { text-align: center; }
        .map-container img { max-width: 100%; border-radius: 8px; border: 2px solid #444; }
        .metric { display: flex; justify-content: space-between; margin-bottom: 15px; padding: 10px; background-color: #1e1e2f; border-radius: 5px; }
        .metric-name { font-weight: bold; color: #b0b0b0; }
        .metric-value.danger { color: #ff6b6b; font-weight: bold; }
        .metric-value.safe { color: #00f2c3; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>?? Integrated Synergistic Multi-Peril Resilience</h1>
        <p>Phase 4: Operational Deliverables (Real Data)</p>
    </div>
    <div class="container">
        <div class="card map-container">
            <h2>?? Real Sentinel-2 Hazard Map</h2>
            <img src="Ethiopia_National_Map.png" alt="Real Map">
        </div>
        <div class="card">
            <h2>?? Real-Time Telemetry & Alerts</h2>
            <div class="metric">
                <span class="metric-name">Calculated VCI</span>
                <span class="metric-value danger">11.31% (Threshold: 30%)</span>
            </div>
            <div class="metric">
                <span class="metric-name">Parametric Insurance</span>
                <span class="metric-value danger">PAYOUT TRIGGERED</span>
            </div>
            <div class="metric">
                <span class="metric-name">SSL Encoder Status</span>
                <span class="metric-value safe">Active</span>
            </div>
        </div>
    </div>
</body>
</html>
